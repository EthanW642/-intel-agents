# Middle East agent — standing watchlist, thresholds, and analytical frames.
# Phase 1 scope: this file is the single source of truth for tunable pipeline
# knobs (spec section 7.4) — nothing here should be hardcoded in pipeline code.

domain: middle_east

pipeline:
  # Stage 2 — dedup: cosine-similarity ceiling above which two items are
  # treated as the same underlying story and collapsed to one.
  dedup_similarity_threshold: 0.88
  # Stage 2 — triage: 0-10 relevance score cutoff. Items scoring below this
  # are dropped before Stage 3. Tune based on observed false-negative rate.
  triage_score_threshold: 6
  # Stage 3 — memory: how many semantically related past entries to retrieve
  # from Chroma per run and hand to the analysis stage.
  memory_retrieval_count: 12
  # Ollama model used for triage (Stage 2) AND the prediction resolution
  # check (Stage 2c) — both are local-only, no Anthropic API call.
  triage_model: qwen2.5:14b
  ollama_host: http://localhost:11434

  # Sonnet model for Stage 4 — the ONLY stage that calls the Anthropic API.
  analysis_model: claude-sonnet-5
  # Hard output ceiling passed to the API (thinking + response text share
  # this budget). Not the same thing as the effort knobs below.
  #
  # Was 16000 — too low. Confirmed live 2026-07-24: a real "max"-effort
  # call on 68 items hit the 16000-token cap during thinking, got cut off
  # before it reached the required closing JSON write-back block, and the
  # $0.20 call wrote back zero entities/events/theses/predictions. Raised
  # to 64000 — still too low. Confirmed live 2026-07-25: a real "max"-
  # effort call on 73 triaged items (a genuinely heavy day, correctly
  # escalated per the thresholds below) hit the 64000-token cap again —
  # output_tokens landed at exactly 64000, no JSON block found, $0.68
  # wrote back nothing. Raised to 128000, Sonnet 5's actual documented
  # output ceiling (streaming, which analyze.py already uses) — this
  # doesn't force every call to use 128000 tokens (adaptive thinking only
  # uses what a given day's load actually needs, and max_tokens is just a
  # ceiling, not a spend target), it removes the truncation risk entirely
  # rather than guessing at another still-possibly-too-low number.
  analysis_max_tokens: 128000

  # Thinking depth for Stage 4 (spec 5's "scaled thinking budget, not
  # flat"). NOTE: the spec's original design was a token budget
  # (base ~2000 + ~300/item, capped ~10000) via `thinking.budget_tokens`.
  # That parameter is rejected outright (400) on Sonnet 5 — the current
  # API's equivalent lever is `output_config.effort`
  # (low/medium/high/xhigh/max), so this config translates the same intent
  # onto effort tiers instead of a token count. See
  # pipeline/analyze.py::compute_effort and the README.
  #
  # Deliberately conservative: "high" is a CAP for ordinary days, not a
  # default reached by item count alone — a quiet day should score low or
  # medium. "load" = triaged item count + 2x the number of currently-active
  # theses (candidates for evaluation; thesis evaluation is the expensive
  # part of the reasoning protocol).
  effort_low_max_load: 8
  effort_medium_max_load: 16
  # load above effort_medium_max_load runs at "high" — and stays at "high"
  # regardless of how much higher the load goes, UNLESS the explicit
  # escalation gates below are also met. Escalating past "high" requires
  # BOTH a real item-volume signal AND active theses actually in play this
  # run (an approximation — which theses get a real evidentiary trigger is
  # only known inside the call itself; the count of currently-active
  # theses is the best pre-call proxy).
  #
  # xhigh_min_active_theses/max_min_active_theses were 1/2 — too low.
  # Confirmed live 2026-07-24: the 2 permanently-seeded standing theses
  # (Khamenei succession, escalation/de-escalation signaling) never expire
  # on their own, so "active_theses >= 2" was satisfied unconditionally,
  # every single day, forever — leaving only the item-count gate doing any
  # real work, and a real run saw 100% triage survival (68/68) from just
  # the RSS feeds alone. That combination made "max" effort the routine
  # daily outcome rather than the reserved-for-genuinely-heavy-days
  # behavior this was designed for. First attempt raised both by 1
  # (1->2, 2->3) — verified that was still wrong: with exactly 2 permanent
  # seed theses, "active_theses >= 2" still holds, so xhigh still
  # auto-escalated every day, just one tier lower than before. Both
  # thresholds must be strictly greater than 2 (the permanent count) to
  # actually require a NEW thesis to have formed, not just the seed set —
  # set to 3/4.
  xhigh_min_triaged_items: 20
  xhigh_min_active_theses: 3
  max_min_triaged_items: 35
  max_min_active_theses: 4

  # Daily schedule for the full pipeline run (local time). Spec targets a
  # 5:30am run, completion/send by 6:15, buffer before a 6:30 read time.
  run_hour: 5
  run_minute: 30

  # Thesis dormancy window (spec 3.B): an active/reinforced/complicated
  # thesis with no new corroborating evidence for this many days moves to
  # dormant (not falsified — falsified is reserved for active contradiction).
  dormancy_window_days: 14

  # Prediction tracking (spec 3.C). Below this many *resolved* dated
  # predictions, the track-record summary is omitted from Call 2's prompt
  # entirely rather than forcing a misleadingly small sample into it.
  predictions_min_for_track_record: 5

# Standing entity watchlist (spec section 4, Agent 1). Seeded into the
# `entities` table on first run if not already present.
entities:
  - name: IRGC Leadership
    type: institution
    notes: "Islamic Revolutionary Guard Corps command structure, incl. Quds Force."
  - name: Israeli War Cabinet
    type: institution
    notes: "Israeli security cabinet composition and decision-making body."
  - name: Hezbollah Leadership
    type: institution
    notes: "Hezbollah command structure and political leadership."
  - name: Houthi Command Structure
    type: institution
    notes: "Ansar Allah (Houthi) military and political command."
  - name: Gulf State Foreign Ministries
    type: institution
    notes: "Key Gulf Cooperation Council foreign ministries (Saudi, UAE, Qatar, etc.)."
  - name: US CENTCOM
    type: institution
    notes: "US Central Command posture and force deployment in the region."
  - name: Ali Khamenei
    type: person
    notes: "Supreme Leader of Iran; subject of the standing succession/consolidation thesis."

# Standing theses seeded on first run (spec section 3.B, `theses` table).
# The analysis stage must check every day's items against these before
# treating anything as a one-off, and update status (active/confirmed/falsified).
standing_theses:
  - title: "Khamenei succession and consolidation"
    statement: >
      Iran's succession dynamics and IRGC consolidation of power around the
      Supreme Leader's office are an active, ongoing process, not a one-off
      event — track candidate positioning, IRGC influence over the Assembly
      of Experts, and any formal succession-planning signals as they occur.
    status: active
  - title: "Escalation/de-escalation signaling vs. stated positions"
    statement: >
      Track escalation and de-escalation signaling (troop movements, force
      posture, direct/indirect messaging) as a separate thread from actors'
      stated public positions, and flag explicitly whenever stated position
      and revealed behavior diverge.
    status: active

# Analytical frame injected into the Sonnet system prompt (see
# prompts/analysis_system.md) — kept here too so it's visible/tunable
# alongside the rest of the domain config.
analytical_frame: >
  Track escalation/de-escalation signaling separately from stated positions;
  flag when an actor's stated position and revealed behavior diverge;
  maintain a running "succession and consolidation" thread for Iran as an
  active, updating thesis rather than a one-off analysis.
