# Middle East agent — Stage 1 (ingest) source configuration.
#
# IMPORTANT: this file's URLs could not be verified with a live network call
# from the environment this project was built in (its network policy blocks
# arbitrary outbound domains, GDELT/RSS hosts included). Before relying on
# this in production, confirm every URL below actually resolves from your
# machine (`curl -I <url>`) and adjust here if any have moved — ingest.py
# is written to log-and-skip a dead source rather than crash, but a silently
# dead source still means quietly losing an ingestion channel.

domain: middle_east

gdelt:
  # Handled via the `gdelt` PyPI package (gdeltPyR), which pulls the GDELT
  # 2.0 Event Database directly from data.gdeltproject.org — no API key.
  table: events
  # How many days back to pull on each run (GDELT 2.0 updates every 15 min;
  # a 1-day window covers a daily-cadence agent run with margin).
  lookback_days: 1
  # Actor1CountryCode / Actor2CountryCode use CAMEO 3-letter country codes,
  # which for current states match ISO 3166-1 alpha-3. An event is kept if
  # EITHER actor's country code is in this list.
  actor_country_codes:
    - ISR  # Israel
    - PSE  # Palestine (West Bank / Gaza)
    - LBN  # Lebanon
    - SYR  # Syria
    - IRN  # Iran
    - IRQ  # Iraq
    - SAU  # Saudi Arabia
    - YEM  # Yemen
    - JOR  # Jordan
    - EGY  # Egypt
    - ARE  # United Arab Emirates
    - QAT  # Qatar
    - BHR  # Bahrain
    - KWT  # Kuwait
    - OMN  # Oman
    - TUR  # Turkey (regionally entangled: Syria, Kurdish issues)
    - USA  # catches US CENTCOM / US-actor events involving the region
  # ActionGeo_CountryCode uses FIPS 10-4 2-letter codes, which diverge from
  # ISO for several countries in this list (e.g. Iraq is IZ in FIPS, not IQ).
  # UNVERIFIED against the GDELT codebook from this build environment —
  # double check before depending on this filter alone.
  geo_country_codes:
    - IS  # Israel
    - WE  # West Bank
    - GZ  # Gaza Strip
    - LE  # Lebanon
    - SY  # Syria
    - IR  # Iran
    - IZ  # Iraq (FIPS, not ISO "IQ")
    - SA  # Saudi Arabia
    - YM  # Yemen
    - JO  # Jordan
    - EG  # Egypt
    - AE  # United Arab Emirates
    - QA  # Qatar
    - BA  # Bahrain
    - KU  # Kuwait
    - MU  # Oman
    - TU  # Turkey
  # Only keep events whose GoldsteinScale magnitude or NumMentions clears a
  # floor, to avoid flooding triage with trivial/low-signal wire events.
  min_num_mentions: 5

liveuamap:
  # High-recall, lower-reliability rapid-update layer (spec 4.1). Treat
  # exactly like any other RSS source at triage time — no whitelisting past
  # triage. Polled more frequently than the narrative RSS layer.
  #
  # DISABLED as of 2026-07-23 verification: the free /rss route now
  # returns a 302 redirect to https://israelpalestine.liveuamap.com/promo/api
  # (a signup page for their paid API tier) regardless of request headers —
  # confirmed via `curl -D -` showing the raw redirect, not a bot-wall.
  # This is the exact contingency the spec already calls out: "A paid
  # LiveUAMap API tier exists ... not needed to start — only revisit if
  # the free RSS feed proves too thin." The free tier isn't thin here, it's
  # gone. ingest.py skips this source entirely while enabled: false.
  # Re-enable (and update feed_url if the paid tier uses a different one)
  # if/when a LiveUAMap API key is obtained — see README.
  enabled: false
  feed_url: "https://israelpalestine.liveuamap.com/rss"
  poll_interval_minutes: 20
  tier: 4  # rapid/uncorroborated — needs Tier 1/2 corroboration (spec 5.1)

rss_feeds:
  # Narrative/context layer. Phase 1 uses 3 of the spec's 6 named sources.
  # Reuters is deliberately excluded — the spec explicitly prohibits it
  # ("Reuters discontinued public RSS feeds in 2020 — do not use a Reuters
  # RSS source"; wire content is still captured indirectly via GDELT's GKG
  # layer). Tehran Times is included specifically per spec 4.1: it's the
  # source that makes the stated-vs-revealed-behavior divergence check
  # (spec 5, reasoning step 3) actually checkable rather than one-sided.
  # Extend with AP Middle East / Middle East Eye / Axios Middle East in a
  # later phase per spec section 4.
  - name: "Times of Israel"
    url: "https://www.timesofisrael.com/feed/"
    poll_interval_minutes: 60
    tier: 3  # aligned/interpretive — reliable on facts, framing attributed to source
  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    poll_interval_minutes: 60
    tier: 2  # wire/agency — treated as reliable factual reporting
    note: "General AJ feed, not ME-specific — triage filters relevance."
  - name: "Tehran Times"
    url: "https://www.tehrantimes.com/rss"
    poll_interval_minutes: 60
    tier: 3  # aligned/interpretive — explicitly establishment-aligned, not neutral (spec 4.1)
    note: "Domestic Iranian English-language daily — captures Iran's own stated/official framing directly, not filtered through Western/Israeli coverage of it."
